[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dating-booster"
version = "1.0.0-rc.2.dev0"
description = "Local-first memory, drafting, safety, and GUI workflow tools for dating assistants."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
models = ["openai>=2,<3"]
test = [
    "jsonschema>=4,<5",
    "mypy>=1.13,<2",
    "pytest>=8",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "mypy>=1.13,<2",
    "pytest>=8",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
dating-boost = "dating_boost.cli:main"
dating-boost-host-loop = "dating_boost.host_loop:main"
dating-boostd = "dating_boost.core.daemon:daemon_entry"

[tool.setuptools.packages.find]
include = ["dating_boost*"]

[tool.setuptools.package-data]
dating_boost = [
    "resources/app_profiles/*.json",
    "resources/schemas/*.json",
    "resources/agent_adapters/claude-code/adapter-package.json",
    "resources/agent_adapters/claude-code/README.md",
    "resources/agent_adapters/claude-code/INSTALL.md",
    "resources/agent_adapters/claude-code/skills/dating-booster/SKILL.md",
    "resources/agent_adapters/openclaw/adapter-package.json",
    "resources/agent_adapters/openclaw/README.md",
    "resources/agent_adapters/openclaw/INSTALL.md",
    "resources/agent_adapters/openclaw/skills/dating-booster/SKILL.md",
    "resources/agent_adapters/shared/references/contracts.md",
    "resources/agent_adapters/shared/references/workflows.md",
    "resources/agent_adapters/codex/dating-booster-codex/INSTALL.md",
    "resources/agent_adapters/codex/dating-booster-codex/SKILL.md",
    "resources/agent_adapters/codex/dating-booster-codex/skill-package.json",
    "resources/agent_adapters/codex/dating-booster-codex/examples/codex-first-workflow.md",
    "resources/agent_adapters/codex/dating-booster-codex/scripts/bootstrap_cli.py",
    "resources/agent_adapters/codex/dating-booster-codex/scripts/doctor.py",
    "resources/agent_adapters/codex/dating-booster-codex/references/*.md",
    "resources/agent_adapters/codex/dating-booster-codex/references/workflows.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["dating_boost/resources"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = [
    "dating_boost/apps/registry.py",
    "dating_boost/core/operator.py",
    "dating_boost/core/storage.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
follow_imports = "skip"
