name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Run the full test suite across every supported OS/Python pair
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "31 18 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANONICAL_PYTHON: "3.13"
  DATING_BOOST_KEY_PROVIDER: local

jobs:
  managed-critical:
    name: Managed critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Critical full-managed path
        run: python -m pytest -m managed_critical -q

  pr-core:
    name: PR core
    needs: managed-critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Product and core regression suite
        run: python -m pytest -m "not nightly_lab" -q

  nightly-coverage:
    name: Nightly canonical coverage
    if: ${{ github.event_name == 'schedule' || inputs.full_compatibility == true }}
    needs: managed-critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Canonical coverage
        run: >-
          python -m pytest -m "not nightly_lab"
          --cov=dating_boost --cov-report=term --cov-fail-under=60

  quality:
    name: Package and static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install quality dependencies
        run: |
          python -m pip install build
          python -m pip install -e ".[test]"
      - name: Build package
        run: python -m build
      - name: Installed wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/dating-booster-wheel-smoke"
          "$RUNNER_TEMP/dating-booster-wheel-smoke/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dating-booster-wheel-smoke/bin/dating-boost" capabilities --json --data-dir "$RUNNER_TEMP/wheel-smoke-data" > "$RUNNER_TEMP/wheel-capabilities.json"
          "$RUNNER_TEMP/dating-booster-wheel-smoke/bin/python" -c 'import json, pathlib; payload=json.loads(pathlib.Path("wheel-capabilities.json").read_text()); assert set(payload["agent_native_capabilities"]["supported_app_profiles"]) == {"bumble", "tashuo", "tinder", "wechat"}'
      - name: Static quality
        run: |
          python -m ruff check dating_boost tests scripts
          python -m mypy
      - name: Whitespace
        run: git diff --check
      - name: Agent-native smoke
        run: python scripts/agent_native_smoke.py

  compatibility-contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ github.event_name != 'schedule' && inputs.full_compatibility != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Cross-platform contracts
        run: >-
          python -m pytest
          tests/test_policy.py
          tests/test_confirmation_contract.py
          tests/test_runtime_safety_cli.py
          tests/test_ci_config.py
          -q

  full-compatibility:
    name: Full compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ github.event_name == 'schedule' || inputs.full_compatibility == true }}
    needs: managed-critical
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Full compatibility suite
        run: python -m pytest -q
